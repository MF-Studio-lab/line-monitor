<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LINE 客戶服務監控系統{% endblock %} - GREEN INDUSTRY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 導覽列 -->
    <nav class="bg-green-800 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                    <div>
                        <span class="text-lg font-bold">LINE 客戶服務監控</span>
                        <span class="text-xs text-green-300 ml-2">GREEN INDUSTRY CO., LTD.</span>
                    </div>
                </div>
                <div class="flex gap-1">
                    <a href="/" class="px-4 py-2 rounded {% if active == 'dashboard' %}bg-green-600{% else %}hover:bg-green-700{% endif %} transition">儀表板</a>
                    <a href="/messages" class="px-4 py-2 rounded {% if active == 'messages' %}bg-green-600{% else %}hover:bg-green-700{% endif %} transition">訊息日誌</a>
                    <a href="/settings" class="px-4 py-2 rounded {% if active == 'settings' %}bg-green-600{% else %}hover:bg-green-700{% endif %} transition">設定</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主內容 -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 頁尾 -->
    <footer class="text-center text-gray-400 text-xs py-4">
        LINE Customer Service Monitor v1.0 &copy; 2026 GREEN INDUSTRY CO., LTD.
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
